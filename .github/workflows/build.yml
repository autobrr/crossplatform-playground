name: Build

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - 'v*'
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - 'config.toml'
      - 'docker-compose.yml'
      - 'Makefile'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/images/**'
      - 'config.toml'
      - 'docker-compose.yml'
      - 'Makefile'
      - '**.md'

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            cgo: 0
#          - runner: ubuntu-latest
#            goos: freebsd
#            cgo: 0
          - runner: macos-latest
            goos: darwin
            cgo: 1
          - runner: windows-latest
            goos: windows
            cgo: 1
    runs-on: ${{ matrix.runner }}
    name: Build distribution binaries ${{ matrix.goos }} ${{ matrix.runner }}
    env:
      flags: ""
      GOOS: ${{ matrix.goos }}
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Add msbuild to PATH
        if : ${{ matrix.runner == 'windows-latest' }}
        uses: microsoft/setup-msbuild@v1.1

      - name: Install WiX
        if : ${{ matrix.runner == 'windows-latest' }}
        run: dotnet tool install --global wix

      #      - name: Build WiX on Windows
      #        if : ${{ matrix.os == 'windows-latest' }}
      #        run: wix build .\nexus.wxs

      - if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "flags=--nightly" >> $GITHUB_ENV

      - name: Get short SHA
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Cache builds
        uses: actions/cache@v4
        with:
          path: dist/${{ matrix.goos }}
          key: ${{ matrix.goos}}-${{ env.sha_short }}${{ env.flags }}
          enableCrossOsArchive: ${{ matrix.runner == 'windows-latest' && 'true' || 'false'}}

      - name: Run GoReleaser snapshot build
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --skip=validate,publish --snapshot --split ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Run GoReleaser build
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --split ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.goos }}
          path: |
            dist/${{ matrix.goos }}/*.tar.gz
            dist/${{ matrix.goos }}/*.zip
            dist/${{ matrix.goos }}/*.apk
            dist/${{ matrix.goos }}/*.deb
            dist/${{ matrix.goos }}/*.rpm

  release:
    name: Merge and publish distribution binaries
    runs-on: ubuntu-latest
    needs: prepare
    env:
      flags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true


      # copy the caches from prepare
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "flags=--nightly" >> $GITHUB_ENV

      - name: Get short SHA
        shell: bash
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get Linux cache
        uses: actions/cache@v4
        with:
          path: dist/linux
          key: linux-${{ env.sha_short }}${{ env.flags }}

#      - name: Get FreeBSD cache
#        uses: actions/cache@v4
#        with:
#          path: dist/freebsd
#          key: freebsd-${{ env.sha_short }}${{ env.flags }}

      - name: Get Darwin cache
        uses: actions/cache@v4
        with:
          path: dist/darwin
          key: darwin-${{ env.sha_short }}${{ env.flags }}

      - name: Get Windows cache
        uses: actions/cache@v4
        with:
          path: dist/windows
          key: windows-${{ env.sha_short }}${{ env.flags }}
          enableCrossOsArchive: true

      # release
      - name: Merge and continue GoReleaser build
        uses: goreleaser/goreleaser-action@v6
        if: steps.cache.outputs.cache-hit != 'true' # do not run if cache hit
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Publish version to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}